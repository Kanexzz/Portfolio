<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="contact-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cont-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#cont-shadow)">
    <!-- Card Base -->
    <rect x="6" y="8" width="36" height="32" rx="4" fill="url(#contact-bg)"/>
    <!-- Orange bookmark ribbon on top -->
    <polygon points="12,8 20,8 20,16 16,13 12,16" fill="#e95420"/>
    <!-- Avatar silhouette -->
    <circle cx="24" cy="20" r="5" fill="#ffffff"/>
    <path d="M15 32 C15 26 33 26 33 32 Z" fill="#ffffff"/>
  </g>
</svg>
