<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="exp-ub-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a403d"/>
      <stop offset="50%" stop-color="#322c2a"/>
      <stop offset="100%" stop-color="#1f1b1a"/>
    </linearGradient>
    <linearGradient id="metal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="exp-ub-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Handle -->
  <path d="M18 13 C18 9 30 9 30 13" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <!-- Briefcase Body -->
  <rect x="5" y="14" width="38" height="27" rx="5" fill="url(#exp-ub-bg)" stroke="#111827" stroke-width="0.8" filter="url(#exp-ub-shadow)"/>
  <!-- Top Flap Line -->
  <path d="M5 23 L24 28 L43 23" fill="none" stroke="#e95420" stroke-width="2"/>
  <!-- Lock Clasp -->
  <rect x="22" y="26" width="4" height="5" rx="1" fill="url(#metal-gold)"/>
</svg>
