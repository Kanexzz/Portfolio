<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="mine-sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="40%" stop-color="#1f2937"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="spike-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="mine-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#mine-shadow)">
    <!-- Background rounded tile -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#3b3a36" stroke="#4d4b46" stroke-width="1.5"/>
    
    <!-- Spikes radiating from center (24, 25) -->
    <line x1="24" y1="12" x2="24" y2="38" stroke="url(#spike-grad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="25" x2="37" y2="25" stroke="url(#spike-grad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="16" x2="33" y2="34" stroke="url(#spike-grad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="33" y1="16" x2="15" y2="34" stroke="url(#spike-grad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Main Mine Sphere -->
    <circle cx="24" cy="25" r="11" fill="url(#mine-sphere)"/>

    <!-- Light reflection on top-left of sphere -->
    <ellipse cx="20.5" cy="21" rx="3.5" ry="2" transform="rotate(-30 20.5 21)" fill="#ffffff" opacity="0.45"/>

    <!-- Fuse & Spark -->
    <path d="M24 14 Q28 8 32 10" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="10" r="4.5" fill="url(#spark-glow)"/>
    <circle cx="32" cy="10" r="1.5" fill="#ffffff"/>
  </g>
</svg>
