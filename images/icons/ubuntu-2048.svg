<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="g2048-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#edc22e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="g2048-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#g2048-shadow)">
    <!-- Base Squircle -->
    <rect x="3" y="3" width="42" height="42" rx="10" ry="10" fill="url(#g2048-bg)"/>
    <rect x="4" y="4" width="40" height="40" rx="9" ry="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35"/>
    
    <!-- 2048 Text -->
    <text x="24" y="28.5" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="14" 
          font-weight="900" 
          letter-spacing="-0.8" 
          fill="#ffffff" 
          text-anchor="middle"
          filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.4))">
      2048
    </text>
  </g>
</svg>
