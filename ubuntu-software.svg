<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="soft-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57b49"/>
      <stop offset="40%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c93e0e"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Bag Body -->
  <g filter="url(#soft-shadow)">
    <!-- Handle -->
    <path d="M17 14 C17 8 31 8 31 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="6" y="14" width="36" height="28" rx="6" fill="url(#soft-bg)"/>
    <!-- Ubuntu software "A" / Graduation Book icon inside -->
    <!-- Graduation / Book Emblem in White -->
    <polygon points="24,20 36,25 24,30 12,25" fill="#ffffff"/>
    <path d="M16 28 C16 33 32 33 32 28" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="34" cy="30" r="1.5" fill="#ffffff"/>
  </g>
</svg>
