<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="nautilus-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#77216f"/>
      <stop offset="100%" stop-color="#5e2750"/>
    </linearGradient>
    <linearGradient id="nautilus-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57b49"/>
      <stop offset="40%" stop-color="#e95420"/>
      <stop offset="100%" stop-color="#c93e0e"/>
    </linearGradient>
    <filter id="yaru-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Folder Back -->
  <g filter="url(#yaru-shadow)">
    <path d="M4 11 C4 9 5.5 7.5 7.5 7.5 L17 7.5 C19 7.5 21 10 23 10 L40.5 10 C42.5 10 44 11.5 44 13.5 L44 37.5 C44 39.5 42.5 41 40.5 41 L7.5 41 C5.5 41 4 39.5 4 37.5 Z" fill="url(#nautilus-back)"/>
  </g>

  <!-- White Paper Inside -->
  <rect x="8" y="12" width="32" height="16" rx="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="24" cy="20" r="4" fill="#77216f" opacity="0.6"/>

  <!-- Folder Front -->
  <path d="M4 17 C4 15.5 5.5 14 7.5 14 L40.5 14 C42.5 14 44 15.5 44 17 L44 37.5 C44 39.5 42.5 41 40.5 41 L7.5 41 C5.5 41 4 39.5 4 37.5 Z" fill="url(#nautilus-front)"/>
  <!-- Front flap highlight line -->
  <line x1="6" y1="15" x2="42" y2="15" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
</svg>
