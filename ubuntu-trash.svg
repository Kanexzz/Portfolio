<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="trash-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#e2e8f0" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="trash-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="trash-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#trash-shadow)">
    <!-- Trash Can Body (Tapered Bucket) -->
    <path d="M12 14 L15 42 C15.2 43.5 16.5 44 18 44 L30 44 C31.5 44 32.8 43.5 33 42 L36 14 Z" fill="url(#trash-glass)" stroke="#64748b" stroke-width="0.8"/>
    
    <!-- Vertical Ribs/Reflections on Glass -->
    <line x1="18" y1="17" x2="19.5" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="24" y1="17" x2="24" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <line x1="30" y1="17" x2="28.5" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Outer Rim (Top Oval) -->
    <ellipse cx="24" cy="13" rx="14" ry="4" fill="url(#trash-rim)" stroke="#475569" stroke-width="0.8"/>
    <ellipse cx="24" cy="13" rx="12" ry="2.8" fill="#475569" opacity="0.4"/>
  </g>
</svg>
