<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Tetromino Gradients -->
    <linearGradient id="tet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tet-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tet-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="tet-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="tet-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="tet-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tet-shadow)">
    <!-- Base Rounded Tile -->
    <rect x="2" y="2" width="44" height="44" rx="10" fill="#3b3a36" stroke="#4d4b46" stroke-width="1.5"/>

    <!-- T-Piece (Purple) -->
    <rect x="18" y="10" width="12" height="12" rx="2" fill="url(#tet-purple)" stroke="#7e22ce" stroke-width="0.8"/>
    <rect x="6" y="22" width="12" height="12" rx="2" fill="url(#tet-purple)" stroke="#7e22ce" stroke-width="0.8"/>
    <rect x="18" y="22" width="12" height="12" rx="2" fill="url(#tet-purple)" stroke="#7e22ce" stroke-width="0.8"/>
    <rect x="30" y="22" width="12" height="12" rx="2" fill="url(#tet-purple)" stroke="#7e22ce" stroke-width="0.8"/>

    <!-- L-Piece / Corner Blocks (Orange & Cyan) -->
    <rect x="6" y="34" width="12" height="10" rx="2" fill="url(#tet-orange)" stroke="#c2410c" stroke-width="0.8"/>
    <rect x="18" y="34" width="12" height="10" rx="2" fill="url(#tet-yellow)" stroke="#a16207" stroke-width="0.8"/>
    <rect x="30" y="34" width="12" height="10" rx="2" fill="url(#tet-cyan)" stroke="#0369a1" stroke-width="0.8"/>

    <!-- Specular Bevel Highlights on Tiles -->
    <line x1="19" y1="11" x2="29" y2="11" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="7" y1="23" x2="17" y2="23" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="19" y1="23" x2="29" y2="23" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="31" y1="23" x2="41" y2="23" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
