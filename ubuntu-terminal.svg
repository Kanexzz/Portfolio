<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c3b37"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <filter id="term-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Terminal Body -->
  <rect x="4" y="6" width="40" height="36" rx="6" fill="url(#term-bg)" stroke="#4e4d48" stroke-width="0.8" filter="url(#term-shadow)"/>
  
  <!-- Terminal Prompt >_ -->
  <path d="M12 16 L20 22 L12 28" fill="none" stroke="#e95420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="28" x2="34" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Code snippet subtle lines -->
  <line x1="12" y1="34" x2="28" y2="34" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
